[Service]
# Each connection starts with an unknown pose and asks the owner by voice.
Restart=on-failure
SupplementaryGroups=i2c
RuntimeDirectory=garmyfriend-orangepi-zero2w
RuntimeDirectoryMode=0750
Environment=GAR_FRIEND_LIVE_BODY=1
Environment=GAR_FRIEND_START_POSE=ask
Environment=GAR_EFFECTS_DIR=
Environment=GAR_FRIEND_CONTROL_SOCKET=/run/garmyfriend-orangepi-zero2w/control.sock
